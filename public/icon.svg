<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#022c22" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <g filter="url(#softShadow)" fill="none" stroke="url(#accent)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- Growth trajectory (V) + Predictive Ascending Node -->
    <path d="M140 190 L220 340 L310 240 L380 150" />
    <!-- Dynamic Forecast Trend Dash -->
    <path d="M380 150 L310 150 M380 150 L380 220" stroke-width="24" />
  </g>
  <!-- Data Node Markers -->
  <circle cx="140" cy="190" r="14" fill="#a7f3d0" />
  <circle cx="220" cy="340" r="14" fill="#a7f3d0" />
  <circle cx="310" cy="240" r="14" fill="#a7f3d0" />
  <circle cx="380" cy="150" r="18" fill="#ffffff" />
  <!-- Calming Zen Dot -->
  <circle cx="256" cy="410" r="8" fill="#a7f3d0" opacity="0.6" />
</svg>
